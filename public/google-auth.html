<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Iniciar Sesión con Google - megaAnime</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #171717;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .logo {
      font-size: 26px;
      font-weight: 900;
      color: #e11d48;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }
    .logo span { color: #ffffff; }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(225, 29, 72, 0.2);
      border-top-color: #e11d48;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      background: #e11d48;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: bold;
      margin-top: 24px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiOUFkE_JabN1ho29lZoxssj33TXHUZlg",
      authDomain: "megaanime-1c250.firebaseapp.com",
      projectId: "megaanime-1c250",
      storageBucket: "megaanime-1c250.firebasestorage.app",
      messagingSenderId: "642402487201",
      appId: "1:642402487201:web:0a0510b6bb43ea6fba99e0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const params = new URLSearchParams(window.location.search);
    const state = params.get("state") || "";

    function returnToApp(user) {
      const statusEl = document.getElementById("status");
      const actionEl = document.getElementById("action-btn");
      const spinnerEl = document.getElementById("spinner");
      if (spinnerEl) spinnerEl.style.display = "none";
      statusEl.textContent = "¡Autenticado con éxito! Abriendo megaAnime App...";
      
      const queryParams = "uid=" + encodeURIComponent(user.uid) + "&email=" + encodeURIComponent(user.email || "") + "&name=" + encodeURIComponent(user.displayName || "") + "&photo=" + encodeURIComponent(user.photoURL || "") + "&state=" + encodeURIComponent(state);
      const returnUrl = "megaanime://auth-callback?" + queryParams;
      const legacyReturnUrl = "net.megaanime.app://auth-callback?" + queryParams;
      
      if (actionEl) {
        actionEl.style.display = "block";
        actionEl.href = returnUrl;
        actionEl.textContent = "Abrir en megaAnime App";
        actionEl.onclick = null;
      }

      window.location.href = returnUrl;

      setTimeout(() => {
        try {
          window.location.href = legacyReturnUrl;
        } catch(e) {}
      }, 500);
    }

    async function login() {
      const statusEl = document.getElementById("status");
      const actionEl = document.getElementById("action-btn");
      const spinnerEl = document.getElementById("spinner");
      try {
        if (spinnerEl) spinnerEl.style.display = "block";
        statusEl.textContent = "Conectando de forma segura con Google...";
        const result = await signInWithPopup(auth, provider);
        if (result && result.user) {
          returnToApp(result.user);
        }
      } catch (err) {
        console.warn("Popup notice:", err);
        if (spinnerEl) spinnerEl.style.display = "none";
        statusEl.textContent = "Toca el botón abajo para identificarte con tu cuenta de Google:";
        if (actionEl) {
          actionEl.style.display = "block";
          actionEl.href = "#";
          actionEl.onclick = (e) => {
            e.preventDefault();
            signInWithRedirect(auth, provider);
          };
          actionEl.textContent = "Continuar con Google";
        }
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const redirectRes = await getRedirectResult(auth);
        if (redirectRes && redirectRes.user) {
          returnToApp(redirectRes.user);
          return;
        }
      } catch(e) {
        console.warn("Redirect check:", e);
      }

      const actionEl = document.getElementById("action-btn");
      if (actionEl) {
        actionEl.onclick = (e) => {
          e.preventDefault();
          login();
        };
      }
      login();
    });
  </script>
</head>
<body>
  <div class="card">
    <div class="logo">mega<span>Anime</span></div>
    <div id="spinner" class="spinner"></div>
    <p id="status" style="color:#a3a3a3; font-size:14px; margin:0; line-height: 1.5;">Iniciando sesión segura con Google...</p>
    <a id="action-btn" class="btn" style="display:block; margin-top: 18px;" href="#">Continuar con Google</a>
  </div>
</body>
</html>
